[env:native]
platform = native
test_framework = unity
; les suites test_oled_* ont besoin du matériel
test_ignore = test_oled_*
lib_ldf_mode = off
build_flags =
    -std=gnu++11
    -Wall -Wextra
    -Itest/mocks
    -Ilib/DualSSD1306